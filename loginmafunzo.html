<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafunzo | The Timothy Discipleship</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px; /* Nafasi kwa ajili ya simu */
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            position: relative;
            margin-top: 40px; /* Nafasi ya icon ya juu */
        }

        .brand-icon {
            width: 70px;
            height: 70px;
            background: #f97316;
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 10px 20px rgba(249, 115, 22, 0.3);
            font-size: 2rem;
            color: white;
            border: 4px solid white;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-icon">📚</div>
        
        <div class="text-center mb-8 mt-4">
            <h2 class="text-2xl font-black text-blue-900 uppercase tracking-tighter">Aloyce Courses</h2>
            <p id="greeting" class="text-sm text-slate-500 font-medium">Karibu katika Mafunzo ya TTD</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Email ya Mwanafunzi</label>
                <input type="email" id="email" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none transition-all focus:border-orange-500 focus:ring-2 focus:ring-orange-200" 
                    placeholder="mfano@gmail.com" required>
            </div>

            <div class="relative">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Nenosiri (Password)</label>
                <input type="password" id="password" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none transition-all focus:border-orange-500 focus:ring-2 focus:ring-orange-200" 
                    placeholder="••••••••" required>
                <button type="button" onclick="togglePassword()" id="toggleBtn"
                    class="absolute right-3 top-[38px] text-xs font-bold text-slate-400 hover:text-orange-600 transition-colors">
                    ONYESHA
                </button>
            </div>

            <button type="submit" id="loginBtn" 
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-xl shadow-lg shadow-orange-200 transition-all transform active:scale-95 uppercase tracking-widest text-sm">
                Ingia Kusoma
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-slate-600">Huna akaunti ya mafunzo?</p>
            <a href="https://wa.me/255757344860?text=Ndiyo%20nataka%20kujifunza" 
               target="_blank"
               class="inline-block mt-2 text-blue-700 font-bold hover:text-orange-500 transition-colors border-b-2 border-blue-100 hover:border-orange-200 pb-1 uppercase text-xs tracking-widest">
               Jisajili Hapa sasa
            </a>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-[0.2em] mb-1">Mkufunzi Mkuu</p>
            <p class="text-xs font-black text-blue-900 uppercase">Pastor Aloyce</p>
            <p class="text-[9px] text-slate-400 mt-2 italic px-4">Disciples Community Church - Kisesa, Mwanza</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCv01cdwWFqeDcvMAkILY3K4G8yKJWwL6k",
            authDomain: "pastoraloyce-3530f.firebaseapp.com",
            projectId: "pastoraloyce-3530f",
            storageBucket: "pastoraloyce-3530f.firebasestorage.app",
            messagingSenderId: "978341477941",
            appId: "1:978341477941:web:289e3b0671f00e52907b7c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');

        // Greeting Logic
        const hour = new Date().getHours();
        const greetElement = document.getElementById('greeting');
        if (hour < 12) greetElement.innerText = "Habari za asubuhi, Karibu sana kwenye mafunzo";
        else if (hour < 18) greetElement.innerText = "Habari za mchana, Karibu sana kwenye mafunzo";
        else greetElement.innerText = "Habari za jioni,Karibu sana kwenye mafunzo";

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerText = "KARIBU KWENYE MAFUNZO...";
            loginBtn.classList.add('opacity-70');

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Hakikisha unatumia collection ya "mafunzo" kutofautisha na mifumo mingine
                const docRef = doc(db, "mafunzo", user.email);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    if (userData.active === true) {
                        sessionStorage.setItem('mwanafunzi_jina', userData.name || "mafunzo");
                        window.location.href = "navbarMafunzo.html"; 
                    } else {
                        alert("Samahani! Akaunti yako haipo hai. Wasiliana na Pastor Aloyce.");
                        await signOut(auth);
                        location.reload();
                    }
                } else {
                    alert("Barua pepe hii haijasajiliwa kwenye orodha ya MAFUNZO.");
                    await signOut(auth);
                    location.reload();
                }
            } catch (error) {
                alert("Kosa: Hakikisha Email na Password ni sahihi.");
                loginBtn.disabled = false;
                loginBtn.innerText = "INGIA KUSOMA";
                loginBtn.classList.remove('opacity-70');
            }
        });
    </script>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const btn = document.getElementById("toggleBtn");
            if (password.type === "password") {
                password.type = "text";
                btn.innerText = "FICHA";
            } else {
                password.type = "password";
                btn.innerText = "ONYESHA";
            }
        }
    </script>
</body>
</html>
