<!DOCTYPE html>
<html lang="sw" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTD | CGN Portal Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Inter:wght@300;400;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandBlue: '#1e40af',    
                        brandOrange: '#f97316',  
                    }
                }
            }
        }
    </script>

    <style>
        :root { --main-font: 'Plus Jakarta Sans', sans-serif; }
        body { font-family: var(--main-font); transition: font-size 0.2s ease; }
        .expandable-content { max-height: 0; overflow: hidden; transition: all 0.5s ease-in-out; opacity: 0; }
        .active > .expandable-content { max-height: 5000px; opacity: 1; padding-bottom: 20px; }
        .rotate-icon { transition: transform 0.3s ease; }
        .active > .trigger-area .rotate-icon { transform: rotate(180deg); }
        .cgn-card { border: 2px solid #1e40af; background: #ffffff; border-radius: 1.5rem; overflow: hidden; }
        .dark .cgn-card { background: #1e293b; border-color: #3b82f6; }
        .student-detail-card { border-left: 4px solid #f97316; }
        
        /* Custom UI for Settings */
        .settings-panel { display: none; }
        .settings-panel.open { display: block; }
    </style>
</head>

<body id="mainBody" class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 text-base">

    <nav class="fixed w-full z-50 bg-brandBlue text-white shadow-xl px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-brandOrange p-2 rounded-lg">
                    <span class="text-white font-black text-sm">TTD</span>
                </div>
                <span class="font-black tracking-tighter uppercase text-lg italic">CGN Network</span>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="toggleSettings()" class="bg-white/10 p-2 rounded-full hover:bg-white/20 transition-all" title="Mipangilio">⚙️</button>
                <button onclick="document.documentElement.classList.toggle('dark')" class="text-lg">🌓</button>
            </div>
        </div>

        <!-- Settings Dropdown -->
        <div id="settingsPanel" class="settings-panel absolute right-6 top-20 bg-white dark:bg-slate-800 text-slate-900 dark:text-white p-6 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 w-72 animate-in fade-in zoom-in duration-200">
            <h4 class="font-black text-xs uppercase mb-4 tracking-widest text-brandOrange">Muonekano</h4>
            
            <!-- Font Selection -->
            <div class="mb-4">
                <label class="text-[10px] font-bold uppercase opacity-60">Aina ya Maandishi (Font)</label>
                <select onchange="changeFont(this.value)" class="w-full mt-1 p-2 rounded bg-slate-100 dark:bg-slate-700 text-xs font-bold outline-none border-none">
                    <option value="'Plus Jakarta Sans', sans-serif">Modern (Jakarta)</option>
                    <option value="'Inter', sans-serif">Professional (Inter)</option>
                    <option value="'Lora', serif">Classic (Serif)</option>
                </select>
            </div>

            <!-- Size Slider -->
            <div class="mb-2">
                <label class="text-[10px] font-bold uppercase opacity-60">Ukubwa wa Maandishi (Size)</label>
                <input type="range" min="12" max="24" value="16" oninput="changeSize(this.value)" class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-brandOrange mt-2">
                <div class="flex justify-between text-[10px] font-bold mt-1 opacity-50">
                    <span>Small</span>
                    <span id="sizeVal">16px</span>
                    <span>Large</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-20 px-6 max-w-4xl mx-auto min-h-screen">
        <!-- Dashboard Header -->
        <header class="mb-8 bg-white dark:bg-slate-800 p-6 rounded-3xl border-2 border-brandOrange shadow-lg">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-2xl font-black text-brandBlue dark:text-blue-400 uppercase leading-none">
                        Msimamizi: <span class="text-brandOrange">Pastor Aloyce</span>
                    </h1>
                    <p class="text-[10px] font-bold opacity-60 uppercase mt-2 tracking-widest text-style-sub">Usimamizi wa Church Group Network</p>
                </div>
                
                <div class="flex gap-2">
                    <div class="bg-slate-100 dark:bg-slate-700 px-4 py-2 rounded-xl text-center">
                        <p class="text-[8px] font-bold uppercase opacity-60">Me</p>
                        <p id="totalMe" class="text-lg font-black text-brandBlue dark:text-blue-400">0</p>
                    </div>
                    <div class="bg-slate-100 dark:bg-slate-700 px-4 py-2 rounded-xl text-center">
                        <p class="text-[8px] font-bold uppercase opacity-60">Ke</p>
                        <p id="totalKe" class="text-lg font-black text-pink-500">0</p>
                    </div>
                    <div class="bg-brandBlue text-white px-5 py-2 rounded-xl text-center shadow-lg">
                        <p class="text-[8px] font-bold uppercase opacity-70">Jumla</p>
                        <p id="totalStudentsCount" class="text-lg font-black">0</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Search Filter -->
        <div class="mb-8">
            <input type="text" id="searchInput" onkeyup="filterStudents()" placeholder="Tafuta mwanafunzi kwa jina..." 
                   class="w-full p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-brandOrange outline-none transition-all font-bold text-sm">
        </div>

        <!-- CGN List Container -->
        <section id="cgn-list" class="space-y-6">
            <div class="text-center py-10">
                <p class="animate-pulse font-bold text-slate-400 uppercase text-xs">Inapakia taarifa toka Firebase...</p>
            </div>
        </section>
    </main>

    <footer class="bg-brandBlue text-white pt-10 pb-8 px-6 mt-20">
        <div class="text-center">
            <p class="text-[10px] font-bold uppercase tracking-[0.4em] opacity-40 italic mb-2">Leading with Excellence</p>
            <p class="text-[9px] opacity-60">© 2026 TTD System | Designed by <span class="text-brandOrange text-[10px] font-bold">Pastor Aloyce</span></p>
        </div>
    </footer>

    <script>
        // UI Controls
        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('open');
        }

        function changeFont(fontFamily) {
            document.getElementById('mainBody').style.fontFamily = fontFamily;
        }

        function changeSize(size) {
            document.getElementById('mainBody').style.fontSize = size + 'px';
            document.getElementById('sizeVal').innerText = size + 'px';
        }

        // Close settings when clicking outside
        window.onclick = function(event) {
            const panel = document.getElementById('settingsPanel');
            if (!event.target.closest('#settingsPanel') && !event.target.closest('button[onclick="toggleSettings()"]')) {
                panel.classList.remove('open');
            }
        }
    </script>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCv01cdwWFqeDcvMAkILY3K4G8yKJWwL6k",
            authDomain: "pastoraloyce-3530f.firebaseapp.com",
            projectId: "pastoraloyce-3530f",
            storageBucket: "pastoraloyce-3530f.firebasestorage.app",
            messagingSenderId: "978341477941",
            appId: "1:978341477941:web:289e3b0671f00e52907b7c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const kituoInfo = {
            "Kituo kwa Mama Bhoke": { leaders: "Mama Bhoke na Bro Lazaro", emoji: "🏠" },
            "Kituo kwa Mama Gift": { leaders: "Mama Gift na Bro Michael", emoji: "🌸" },
            "Kituo cha Kanisa": { leaders: "Mama Martina na Madam Aponya", emoji: "⛪" },
            "Kituo cha Online": { leaders: "Bro Msukuma", emoji: "🌐" }
        };

        onSnapshot(collection(db, "wanafunzi"), (snapshot) => {
            const wanafunzi = [];
            snapshot.forEach((doc) => {
                wanafunzi.push({ id: doc.id, ...doc.data() });
            });

            document.getElementById('totalStudentsCount').innerText = wanafunzi.length;
            document.getElementById('totalMe').innerText = wanafunzi.filter(s => s.gender === 'Mme' || s.gender === 'ME').length;
            document.getElementById('totalKe').innerText = wanafunzi.filter(s => s.gender === 'Mke' || s.gender === 'KE').length;

            const grouped = wanafunzi.reduce((acc, curr) => {
                const center = curr.cgn_center || "Bila Kituo";
                if (!acc[center]) acc[center] = [];
                acc[center].push(curr);
                return acc;
            }, {});

            renderUI(grouped);
        });

        function renderUI(groupedData) {
            const container = document.getElementById('cgn-list');
            container.innerHTML = "";

            Object.keys(groupedData).forEach(kituoName => {
                const wanafunziKituoni = groupedData[kituoName];
                const info = kituoInfo[kituoName] || { leaders: "Haijajulikana", emoji: "📍" };
                
                const meCount = wanafunziKituoni.filter(s => s.gender === 'Mme' || s.gender === 'ME').length;
                const keCount = wanafunziKituoni.filter(s => s.gender === 'Mke' || s.gender === 'KE').length;
                const kituoTotal = wanafunziKituoni.length;

                const cardHTML = `
                <div class="cgn-card shadow-lg mb-6 transition-all duration-300">
                    <div class="trigger-area p-6 flex items-center gap-4 cursor-pointer hover:bg-orange-50 dark:hover:bg-slate-800" onclick="this.parentElement.classList.toggle('active')">
                        <div class="text-3xl bg-brandBlue/10 p-3 rounded-2xl">${info.emoji}</div>
                        <div class="flex-1 text-inherit">
                            <h3 class="font-black text-lg text-brandBlue dark:text-white uppercase leading-tight">${kituoName}</h3>
                            <div class="flex gap-2 mt-1">
                                <span class="text-[9px] font-black bg-brandOrange/10 text-brandOrange px-2 py-0.5 rounded uppercase italic">ME: ${meCount}</span>
                                <span class="text-[9px] font-black bg-brandBlue/10 text-brandBlue dark:text-blue-300 px-2 py-0.5 rounded uppercase italic">KE: ${keCount}</span>
                                <span class="text-[9px] font-black bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded uppercase italic">Jumla: ${kituoTotal}</span>
                            </div>
                        </div>
                        <div class="rotate-icon text-brandBlue font-bold">🔽</div>
                    </div>
                    
                    <div class="expandable-content bg-slate-100/50 dark:bg-slate-900/50 px-4 md:px-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                            ${wanafunziKituoni.map(s => `
                                <div class="student-card student-detail-card bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700" data-name="${s.name.toLowerCase()}">
                                    <div class="flex justify-between items-start mb-2">
                                        <h4 class="font-black text-sm text-brandBlue dark:text-blue-300 uppercase">${s.name}</h4>
                                        <span class="text-[10px] font-black ${s.gender === 'Mke' || s.gender === 'KE' ? 'text-pink-500' : 'text-blue-500'} uppercase">
                                            ${s.gender === 'Mme' || s.gender === 'ME' ? '♂ ME' : '♀ KE'}
                                        </span>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <div class="flex-1">
                                            <p class="text-[8px] font-bold opacity-50 uppercase italic tracking-tighter">Mawasiliano</p>
                                            <p class="text-[11px] font-bold text-slate-700 dark:text-slate-300">${s.phone || '---'}</p>
                                        </div>
                                        <div class="flex gap-2">
                                            <a href="sms:${s.phone}" class="bg-brandOrange/10 p-2 rounded-lg text-brandOrange hover:bg-brandOrange hover:text-white transition-colors">✉️</a>
                                            <a href="tel:${s.phone}" class="bg-brandBlue/10 p-2 rounded-lg text-brandBlue dark:text-blue-300 hover:bg-brandBlue hover:text-white transition-colors">📞</a>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
                container.innerHTML += cardHTML;
            });
        }
    </script>

    <script>
        function filterStudents() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.student-card');
            cards.forEach(card => {
                const name = card.getAttribute('data-name');
                if (name.includes(input)) {
                    card.style.display = "block";
                    card.closest('.cgn-card').classList.add('active');
                } else {
                    card.style.display = "none";
                }
            });
            if(input === "") {
                document.querySelectorAll('.cgn-card').forEach(c => c.classList.remove('active'));
            }
        }
    </script>
</body>
</html>
