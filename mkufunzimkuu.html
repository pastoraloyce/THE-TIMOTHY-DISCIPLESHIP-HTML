<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mkufunzi Dashboard | Pastoraloyce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #1e3a8a;
            --primary-orange: #f97316;
            --slate-bg: #f1f5f9;
        }
        body { background-color: var(--slate-bg); transition: font-size 0.2s ease-in; }
        .bg-blue-custom { background-color: var(--primary-blue); }
        .btn-orange { background-color: var(--primary-orange); color: white; transition: 0.3s; }
        .btn-orange:hover { background-color: #ea580c; transform: translateY(-1px); }
        .card-border { border-top: 4px solid var(--primary-orange); }
        
        /* Hide sections initially to prevent flickering */
        #main-dashboard, #login-section, #public-nav { display: none; }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-orange);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <nav id="public-nav" class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-blue-900 p-2 rounded-lg text-white">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <span class="font-bold text-xl text-blue-900">Pastoraloyce <span class="text-orange-500 text-sm block leading-none font-medium">Portal</span></span>
            </div>
            <div class="hidden md:flex items-center space-x-6 text-sm font-medium">
                <a href="#" class="text-slate-600 hover:text-blue-900">Nyumbani</a>
                <a href="https://wa.me/255757344860" class="text-slate-600 hover:text-blue-900">Msaada</a>
                <span class="bg-blue-50 text-blue-900 px-3 py-1 rounded-full"><i class="fas fa-lock mr-2"></i>Walimu Tu</span>
            </div>
        </div>
    </nav>

    <div id="login-section" class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-8 border-blue-900">
            <div class="text-center mb-8">
                <div class="inline-block bg-blue-100 p-4 rounded-full mb-4">
                    <i class="fas fa-user-shield text-3xl text-blue-900"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">Mkufunzi Login</h2>
                <p class="text-slate-500 text-sm">Ingia kusimamia kazi za wanafunzi</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Barua Pepe</label>
                    <input type="email" id="loginEmail" placeholder="mfano@gmail.com" 
                           class="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-orange-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" 
                           class="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-orange-500 outline-none transition">
                </div>
                <button onclick="handleLogin()" id="loginBtn"
                        class="w-full btn-orange py-4 rounded-xl font-bold text-lg shadow-lg active:scale-95 transform transition">
                    Ingia Sasa
                </button>
                <p id="loginError" class="text-red-500 text-sm text-center hidden font-medium"></p>
            </div>
        </div>
    </div>

    <div id="main-dashboard">
        <nav class="bg-blue-custom text-white shadow-lg sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="bg-orange-500 p-1.5 rounded-lg">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <span class="font-bold text-lg">Mkufunzi Mkuu</span>
                </div>

                <div class="flex items-center space-x-4">
                    <div class="hidden md:flex items-center bg-blue-900 rounded-lg px-3 py-1 space-x-3 mr-4">
                        <button onclick="changeFontSize('decrease')" class="hover:text-orange-400 p-1"><i class="fas fa-minus-circle"></i></button>
                        <span class="text-[10px] uppercase font-bold text-blue-200">Maandishi</span>
                        <button onclick="changeFontSize('increase')" class="hover:text-orange-400 p-1"><i class="fas fa-plus-circle"></i></button>
                    </div>
                    <button onclick="handleLogout()" class="text-xs font-bold bg-red-500/20 hover:bg-red-600 px-4 py-2 rounded-lg transition border border-red-500/30">
                        <i class="fas fa-sign-out-alt mr-1"></i> Toka
                    </button>
                </div>
            </div>
        </nav>

        <main class="max-w-5xl mx-auto w-full p-4 md:p-8" id="content-area">
            <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl md:text-3xl font-extrabold text-blue-900">Kazi za Wanafunzi</h1>
                    <p class="text-slate-500 text-sm italic">Orodha ya majibu yaliyotumwa hivi karibuni.</p>
                </div>
                <div id="count" class="inline-block bg-orange-100 text-orange-700 px-4 py-2 rounded-full text-sm font-bold shadow-sm border border-orange-200">
                    Inapakia...
                </div>
            </header>

            <div id="submissions-list" class="grid gap-6">
                </div>
        </main>
    </div>

    <footer class="bg-slate-900 text-slate-400 py-8 px-4 mt-auto">
        <div class="max-w-5xl mx-auto text-center">
            <div class="text-white font-bold text-xl mb-2">Pastoraloyce <span class="text-orange-500">Courses</span></div>
            <p class="text-xs border-t border-slate-800 pt-6">
                &copy; 2026 Pastoraloyce. | Mwanza, Tanzania.
            </p>
        </div>
    </footer>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCv01cdwWFqeDcvMAkILY3K4G8yKJWwL6k",
            authDomain: "pastoraloyce-3530f.firebaseapp.com",
            projectId: "pastoraloyce-3530f",
            storageBucket: "pastoraloyce-3530f.firebasestorage.app",
            messagingSenderId: "978341477941",
            appId: "1:978341477941:web:289e3b0671f00e52907b7c",
            measurementId: "G-XYK8ZL0JSJ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Auth Observer
        auth.onAuthStateChanged((user) => {
            const loginSection = document.getElementById('login-section');
            const dashboard = document.getElementById('main-dashboard');
            const publicNav = document.getElementById('public-nav');

            if (user) {
                loginSection.style.display = 'none';
                publicNav.style.display = 'none';
                dashboard.style.display = 'block';
                loadSubmissions();
            } else {
                loginSection.style.display = 'flex';
                publicNav.style.display = 'block';
                dashboard.style.display = 'none';
            }
        });

        // Handle Login
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;
            const errorElement = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            if(!email || !pass) {
                showError("Tafadhali jaza sehemu zote.");
                return;
            }

            btn.innerHTML = `<span class="loader"></span> Inahakiki...`;
            btn.disabled = true;
            errorElement.classList.add('hidden');

            try {
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (error) {
                showError("Imeshindikana: " + error.message);
                btn.innerText = "Ingia Sasa";
                btn.disabled = false;
            }
        }

        function showError(msg) {
            const err = document.getElementById('loginError');
            err.innerText = msg;
            err.classList.remove('hidden');
        }

        function handleLogout() {
            if(confirm("Je, unataka kutoka kwenye mfumo?")) {
                auth.signOut();
            }
        }

        // Load Submissions
        function loadSubmissions() {
            const list = document.getElementById('submissions-list');
            const countBadge = document.getElementById('count');

            db.collection("submissions").orderBy("timestamp", "desc")
            .onSnapshot((snapshot) => {
                list.innerHTML = "";
                let pending = 0;

                if (snapshot.empty) {
                    list.innerHTML = `<div class="bg-white p-12 rounded-xl text-center text-slate-400 shadow-sm">Bado hakuna kazi zilizotumwa.</div>`;
                    countBadge.innerText = "0 Kazi";
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const id = doc.id;
                    if (!data.instructorComment) pending++;

                    const isReviewed = !!data.instructorComment;
                    
                    const card = `
                        <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow overflow-hidden card-border">
                            <div class="p-6">
                                <div class="flex justify-between items-start mb-4">
                                    <div class="flex items-center space-x-3">
                                        <div class="h-10 w-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-800 font-bold border border-blue-200">
                                            ${(data.studentName || 'M').charAt(0)}
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-slate-800">${data.studentName || 'Mwanafunzi'}</h3>
                                            <p class="text-[10px] text-slate-400 uppercase tracking-wider">
                                                <i class="far fa-clock mr-1"></i> ${data.timestamp?.toDate().toLocaleString('sw-TZ') || 'Sasa'}
                                            </p>
                                        </div>
                                    </div>
                                    <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${isReviewed ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}">
                                        ${isReviewed ? 'Imekaguliwa' : 'Mpya'}
                                    </span>
                                </div>
                                
                                <div class="bg-slate-50 border border-slate-100 p-4 rounded-lg mb-6 text-slate-700 whitespace-pre-wrap text-sm leading-relaxed shadow-inner">
                                    ${data.content}
                                </div>
                                
                                <div class="space-y-3">
                                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Maoni yako kama Mkufunzi</label>
                                    <textarea id="comment-${id}" 
                                        class="w-full p-4 text-sm border-2 border-slate-100 rounded-xl focus:border-orange-500 outline-none transition-all resize-none bg-white" 
                                        rows="3" placeholder="Andika ushauri au alama hapa...">${data.instructorComment || ''}</textarea>
                                    <button onclick="saveComment('${id}')" 
                                        class="btn-orange w-full md:w-auto px-6 py-2.5 rounded-lg font-bold text-sm shadow-md active:scale-95 transform transition flex items-center justify-center">
                                        <i class="fas fa-check-circle mr-2"></i> Hifadhi Maoni
                                    </button>
                                </div>
                            </div>
                        </div>`;
                    list.innerHTML += card;
                });
                countBadge.innerText = `${pending} Mpya Inazosubiri`;
            });
        }

        async function saveComment(id) {
            const val = document.getElementById(`comment-${id}`).value.trim();
            if(!val) return alert("Tafadhali andika maoni kabla ya kuhifadhi.");

            try {
                await db.collection("submissions").doc(id).update({
                    instructorComment: val,
                    status: "reviewed",
                    reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Maoni yamehifadhiwa!");
            } catch (e) {
                alert("Tatizo: " + e.message);
            }
        }

        // Font Control
        let fontSize = 16;
        function changeFontSize(type) {
            const area = document.getElementById('content-area');
            fontSize = (type === 'increase') ? Math.min(fontSize + 2, 24) : Math.max(fontSize - 2, 12);
            area.style.fontSize = fontSize + 'px';
        }
    </script>
</body>
</html>
