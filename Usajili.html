<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTD | Usajili na Orodha ya Wana CGN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brandBlue: '#1e40af', brandOrange: '#f97316' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .table-container { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tab-active { border-bottom: 4px solid #f97316; color: #f97316; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="fixed w-full z-50 bg-brandBlue text-white shadow-xl px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-brandOrange p-2 rounded-lg">
                    <span class="text-white font-black text-sm">TTD</span>
                </div>
                <span class="font-black tracking-tighter uppercase text-lg">PORTAL YA USAJILI</span>
            </div>
            <div class="hidden md:flex items-center gap-6 text-xs font-bold uppercase">
                <a href="ttdmfumo.html" class="hover:text-brandOrange transition">Nyumbani</a>
                <a href="#" class="text-brandOrange">Usajili</a>
                <a href="ttdmfumo.html" class="bg-white/10 px-4 py-2 rounded-full hover:bg-brandOrange transition">Rudi Kwenye Mfumo</a>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 pt-28 pb-20">
        
        <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100 mb-16">
            <div class="bg-brandBlue p-6 text-center text-white border-b-4 border-brandOrange">
                <h2 id="formTitle" class="text-xl font-black uppercase tracking-tight">Sajili Mwana CGN Mpya</h2>
                <p class="text-[10px] opacity-70 mt-1 uppercase tracking-widest font-bold italic">Msimamizi: Pastor Aloyce</p>
            </div>

            <form id="registrationForm" class="p-8 space-y-4">
                <input type="hidden" id="editEmail">
                <div>
                    <label class="block text-[10px] font-black text-brandBlue uppercase mb-1">Jina Kamili</label>
                    <input type="text" id="name" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brandOrange outline-none transition text-sm" placeholder="Mfano: Baraka Yohana">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-brandBlue uppercase mb-1">Jinsia</label>
                        <select id="gender" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-semibold">
                            <option value="Mme">Mme</option>
                            <option value="Mke">Mke</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-brandBlue uppercase mb-1">Namba ya Simu</label>
                        <input type="text" id="phone" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm" placeholder="0757...">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-brandBlue uppercase mb-1">Kituo cha CGN</label>
                    <select id="center" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-semibold">
                        <option value="Kituo kwa Mama Bhoke">Kituo kwa Mama Bhoke</option>
                        <option value="Kituo kwa Mama Gift">Kituo kwa Mama Gift</option>
                        <option value="Kituo cha Kanisa">Kituo cha Kanisa</option>
                        <option value="Kituo cha Online">Kituo cha Online</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-brandBlue uppercase mb-1">Hali ya Kiroho / CGN</label>
                    <select id="status" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-semibold border-l-4 border-brandOrange">
                        <option value="Yuko Hai">Yuko Hai</option>
                        <option value="Anasuasua">Anasuasua</option>
                        <option value="Kanisa anakuja ila CGN haji">Kanisa anakuja ila CGN haji</option>
                        <option value="Amehama">Amehama</option>
                        <option value="Ameacha kusali kabisa">Ameacha kusali kabisa</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-brandBlue uppercase mb-1">Email (Login ID)</label>
                    <input type="email" id="email" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm" placeholder="email@gmail.com">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-brandOrange text-white font-black py-4 rounded-xl shadow-lg hover:bg-orange-600 transition uppercase tracking-widest text-xs mt-4">Hifadhi Taarifa</button>
                <button type="button" id="cancelEdit" class="hidden w-full bg-slate-200 text-slate-600 font-black py-3 rounded-xl transition uppercase text-[10px]">Ghairi Marekebisho</button>
            </form>
        </div>

        <div class="table-container bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
            <div class="bg-slate-800 p-5 text-white">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-black uppercase text-sm italic">Usimamizi wa Vituo</h3>
                    <button onclick="window.pakuaData()" class="bg-brandBlue hover:bg-blue-700 px-4 py-2 rounded-lg text-[10px] font-black transition">REFRESH</button>
                </div>
                
                <div class="flex gap-4 overflow-x-auto pb-2 scrollbar-hide">
                    <button onclick="filterCenter('All')" id="tabAll" class="tab-btn px-4 py-2 text-[10px] font-black uppercase tab-active whitespace-nowrap">Wote (<span id="countAll">0</span>)</button>
                    <button onclick="filterCenter('Kituo kwa Mama Bhoke')" id="tabBhoke" class="tab-btn px-4 py-2 text-[10px] font-black uppercase whitespace-nowrap">Bhoke (<span id="countBhoke">0</span>)</button>
                    <button onclick="filterCenter('Kituo kwa Mama Gift')" id="tabGift" class="tab-btn px-4 py-2 text-[10px] font-black uppercase whitespace-nowrap">Gift (<span id="countGift">0</span>)</button>
                    <button onclick="filterCenter('Kituo cha Kanisa')" id="tabKanisa" class="tab-btn px-4 py-2 text-[10px] font-black uppercase whitespace-nowrap">Kanisa (<span id="countKanisa">0</span>)</button>
                    <button onclick="filterCenter('Kituo cha Online')" id="tabOnline" class="tab-btn px-4 py-2 text-[10px] font-black uppercase whitespace-nowrap">Online (<span id="countOnline">0</span>)</button>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-[10px] font-black uppercase text-brandBlue border-b">
                            <th class="p-4">Mwanafunzi</th>
                            <th class="p-4">Kituo</th>
                            <th class="p-4">Hali</th>
                            <th class="p-4 text-center">Vitendo</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="text-[11px]">
                        <tr><td colspan="4" class="p-10 text-center animate-pulse">Inapakia...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-brandBlue text-white pt-12 pb-8 px-6">
        <div class="max-w-6xl mx-auto text-center space-y-6">
            <div class="flex justify-center items-center gap-2">
                <div class="bg-brandOrange p-1 rounded"><span class="font-black text-xs">TTD</span></div>
                <span class="font-bold text-lg uppercase tracking-widest">The Timothy Discipleship</span>
            </div>
            <p class="text-[9px] opacity-40 border-t border-white/10 pt-6 uppercase tracking-[0.3em]">© 2026 Designed for Ministry by Pastor Aloyce</p>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, getDocs, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCv01cdwWFqeDcvMAkILY3K4G8yKJWwL6k",
            authDomain: "pastoraloyce-3530f.firebaseapp.com",
            projectId: "pastoraloyce-3530f",
            storageBucket: "pastoraloyce-3530f.firebasestorage.app",
            messagingSenderId: "978341477941",
            appId: "1:978341477941:web:289e3b0671f00e52907b7c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let wanafunziWote = []; // Hifadhi data hapa kwa ajili ya filter

        function getStatusStyle(status) {
            switch(status) {
                case 'Yuko Hai': return 'bg-green-100 text-green-700 border-green-200';
                case 'Anasuasua': return 'bg-yellow-100 text-yellow-700 border-yellow-200';
                case 'Ameacha kusali kabisa': return 'bg-red-100 text-red-700 border-red-200';
                default: return 'bg-slate-100 text-slate-700 border-slate-200';
            }
        }

        window.futaMwanafunzi = async (email, jina) => {
            if (confirm(`Je, una uhakika unataka kumfuta ${jina}?`)) {
                try {
                    await deleteDoc(doc(db, "wanafunzi", email));
                    alert("Amefutwa!");
                    pakuaData();
                } catch (e) { alert("Imeshindwa kufuta."); }
            }
        }

        window.anzaEdit = async (email) => {
            const docRef = doc(db, "wanafunzi", email);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('name').value = data.name;
                document.getElementById('gender').value = data.gender;
                document.getElementById('phone').value = data.phone;
                document.getElementById('center').value = data.cgn_center;
                document.getElementById('status').value = data.status;
                document.getElementById('email').value = email;
                document.getElementById('email').readOnly = true;
                document.getElementById('formTitle').innerText = "Sahihisha Taarifa";
                document.getElementById('submitBtn').innerText = "Update Taarifa";
                document.getElementById('cancelEdit').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        document.getElementById('cancelEdit').onclick = () => {
            document.getElementById('registrationForm').reset();
            document.getElementById('email').readOnly = false;
            document.getElementById('formTitle').innerText = "Sajili Mwana CGN Mpya";
            document.getElementById('submitBtn').innerText = "Hifadhi Taarifa";
            document.getElementById('cancelEdit').classList.add('hidden');
        }

        async function pakuaData() {
            try {
                const querySnapshot = await getDocs(collection(db, "wanafunzi"));
                wanafunziWote = [];
                querySnapshot.forEach(doc => {
                    wanafunziWote.push({ id: doc.id, ...doc.data() });
                });
                updateCounters();
                renderTable(wanafunziWote);
            } catch (e) { console.error(e); }
        }

        function updateCounters() {
            document.getElementById('countAll').innerText = wanafunziWote.length;
            document.getElementById('countBhoke').innerText = wanafunziWote.filter(w => w.cgn_center === 'Kituo kwa Mama Bhoke').length;
            document.getElementById('countGift').innerText = wanafunziWote.filter(w => w.cgn_center === 'Kituo kwa Mama Gift').length;
            document.getElementById('countKanisa').innerText = wanafunziWote.filter(w => w.cgn_center === 'Kituo cha Kanisa').length;
            document.getElementById('countOnline').innerText = wanafunziWote.filter(w => w.cgn_center === 'Kituo cha Online').length;
        }

        window.filterCenter = (centerName) => {
            // Update Tab UI
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('tab-active'));
            if(centerName === 'All') {
                document.getElementById('tabAll').classList.add('tab-active');
                renderTable(wanafunziWote);
            } else {
                const map = {'Kituo kwa Mama Bhoke': 'tabBhoke', 'Kituo kwa Mama Gift': 'tabGift', 'Kituo cha Kanisa': 'tabKanisa', 'Kituo cha Online': 'tabOnline'};
                document.getElementById(map[centerName]).classList.add('tab-active');
                const filtered = wanafunziWote.filter(w => w.cgn_center === centerName);
                renderTable(filtered);
            }
        }

        function renderTable(dataArray) {
            const tableBody = document.getElementById('studentTableBody');
            tableBody.innerHTML = dataArray.length ? "" : "<tr><td colspan='4' class='p-10 text-center opacity-50 italic'>Hakuna data katika kituo hiki.</td></tr>";
            
            dataArray.forEach((data) => {
                const style = getStatusStyle(data.status);
                tableBody.innerHTML += `
                    <tr class="border-b border-slate-50 hover:bg-blue-50 transition">
                        <td class="p-4">
                            <div class="font-black text-brandBlue uppercase">${data.name}</div>
                            <div class="text-[9px] text-slate-400">${data.id}</div>
                        </td>
                        <td class="p-4 text-slate-500 font-bold">${data.cgn_center}</td>
                        <td class="p-4"><span class="${style} px-2 py-1 rounded-full font-black text-[7px] uppercase border">${data.status}</span></td>
                        <td class="p-4 flex justify-center gap-2">
                            <button onclick="window.anzaEdit('${data.id}')" class="bg-blue-50 text-blue-600 p-2 rounded-lg hover:bg-blue-600 hover:text-white transition">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                            </button>
                            <button onclick="window.futaMwanafunzi('${data.id}', '${data.name}')" class="bg-red-50 text-red-600 p-2 rounded-lg hover:bg-red-600 hover:text-white transition">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        const form = document.getElementById('registrationForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Inahifadhi...";
            const email = document.getElementById('email').value.trim();
            const centersMap = { "Kituo kwa Mama Bhoke": "Mama Bhoke na Bro Lazaro", "Kituo kwa Mama Gift": "Mama Gift na Bro Michael", "Kituo cha Kanisa": "Mama Martina na Madam Aponya", "Kituo cha Online": "Bro Msukuma" };

            const data = {
                name: document.getElementById('name').value,
                gender: document.getElementById('gender').value,
                phone: document.getElementById('phone').value,
                cgn_center: document.getElementById('center').value,
                cgn_leaders: centersMap[document.getElementById('center').value],
                status: document.getElementById('status').value,
                active: true
            };

            try {
                await setDoc(doc(db, "wanafunzi", email), data);
                alert("Imefanikiwa!");
                form.reset();
                document.getElementById('email').readOnly = false;
                document.getElementById('formTitle').innerText = "Sajili Mwana CGN Mpya";
                document.getElementById('submitBtn').innerText = "Hifadhi Taarifa";
                document.getElementById('cancelEdit').classList.add('hidden');
                pakuaData();
            } catch (error) { alert("Hitilafu imetokea."); }
            finally { btn.disabled = false; }
        });

        window.onload = pakuaData;
        window.pakuaData = pakuaData;
    </script>
</body>
</html>
